<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yootle</title>
<meta property="og:title" content="Yootle" />
<meta property="og:url" content="https://yootle.com/" />
<link rel="icon" href="favicon.png" />
<style>
  :root {
    --paper:      oklch(97% 0.008 85);
    --paper-warm: oklch(94.5% 0.012 80);
    --ink:        oklch(20% 0.012 60);
    --ink-soft:   oklch(35% 0.012 60);
    --ink-mute:   oklch(52% 0.012 60);
    --accent:     oklch(43% 0.13 30);
    --serif: "Newsreader", "Source Serif Pro", Georgia, serif;
    --sans:  "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .center {
    text-align: center;
    padding: 40px 24px;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 300;
    letter-spacing: -0.02em;
    margin: 0 0 32px;
    color: var(--ink);
  }

  .tagline {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(22px, 3.5vw, 36px);
    font-weight: 300;
    color: var(--ink-soft);
    margin: 0 0 48px;
    line-height: 1.3;
  }

  .institute-link {
    font-family: var(--sans);
    font-size: clamp(13px, 1.5vw, 15px);
    font-weight: 400;
    color: var(--ink-mute);
    text-decoration: none;
    letter-spacing: 0.01em;
    border-bottom: 1px solid oklch(80% 0.012 75);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
  }

  .institute-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="center">
  <h1>Yootle</h1>
  <p class="tagline">Clearer reality. Better returns.</p>
  <a class="institute-link" href="https://institute.yootle.com">institute.yootle.com</a>
</div>
</body>
</html>
